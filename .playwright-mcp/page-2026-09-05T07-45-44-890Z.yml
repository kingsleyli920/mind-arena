            - text: 644 条记录条条有 plan，但 48 局里 25 局的 plan 十六季一字未改。第 6 局 plan 通篇写「夺下泰山郡」，第 11 季实际在打河内郡，plan 从头到尾没动。
          - listitem [ref=f3e669]:
            - strong [ref=f3e670]: 曹操席 8 局全灭，均分 25。
            - text: 8 局第一季用的是同一套开局（曹仁驻济阴 + 刺探山阳东郡 + 倾国攻山阳），老巢一空，7 局在第 3 季就没了。
          - listitem [ref=f3e671]: 唯一偏保守出兵的一方：759 次征伐里只有 28% 选倾国，其余全走主力——征伐占比不低，低的是每一刀的力度。
          - listitem [ref=f3e672]: 爱刷重复令：58 个席·季出现重复，第 46 局第 13 季刘璋把同一条调任刷了 10 遍，16 条令丢掉 13 条。全局白扔 1908 令。
        - blockquote [ref=f3e673]:
          - generic [ref=f3e674]: 第 24 局 · 第 3 季 · 吕布 · reason
          - text: 先刺探东郡、平原郡、彭城国以获取敌军真实数值与阵型，再通过多次调任曹性、孙观于东平国，强化该郡兵力与出征上限，为下季征伐彭城国或东郡做准备。
        - blockquote [ref=f3e675]:
          - generic [ref=f3e676]: 第 6 局 · 第 11 季 · 吕布 · reason（该季实际只花了 3/8 令）
          - text: 优先攻取河内郡以破敌防线，同时安民稳后方、调将强守军，刺探关键敌情以解迷雾；
          - strong [ref=f3e677]: 确保令数用尽
          - text: 并推进核心战略。

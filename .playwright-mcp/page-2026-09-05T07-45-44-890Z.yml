        - text: 两跑的复原数是 775 条和 2 805 条——提供方的编码损坏是
        - strong [ref=f3e959]: 间歇
        - text: 的，两跑之间路由换了。 只有非法率那一列是确定的。基线 bot:balanced 在两跑之间逐局分数
        - strong [ref=f3e960]: 逐位一致
        - text: ， 所以其余对局方的数字可以合并进同一张榜。

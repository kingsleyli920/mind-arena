    - heading "一 · 动作词汇的宽度" [level=3] [ref=f3e800]
    - paragraph [ref=f3e801]:
      - text: 机器人每季只在
      - strong [ref=f3e802]: 探、调任、治、征伐
      - text: 这四个词里打转，
      - strong [ref=f3e803]: 阵一次都不摆
      - text: （三个画像加起来只出过 5 条），招降近乎不用。 四个模型每季用到 4.1~4.4 种动作，阵稳定占 4~6% 的出手，招降在 glm / hy3 / 235b 手里是 5~8% 的常规牌。 阵型与招降这两套机制，机器人根本不碰。
    - heading "二 · 令花到哪里" [level=3] [ref=f3e804]
    - paragraph [ref=f3e805]:
      - text: 机器人把
      - strong [ref=f3e806]: 33%~52% 的令压在调任上
      - text: ——本质上是一台人事调度器， 而且越到后期调任占比越高（均衡流前四季 36.1%，之后升到 48.3%）。 模型的重心散在内政（glm 39%、hy3 38%）和征伐（235b 37%、30b 36%）上，调任只占 9%~27%，且随局势推进递减。
    - heading "三 · 预算的执行度" [level=3] [ref=f3e807]
    - paragraph [ref=f3e808]:
      - text: 机器人每季按满额规划，令数用率 92%~95%、非法率 0。 模型里只有 hy3 跟得上（92%）；glm 72%、235b 74%、30b 67%——
      - strong [ref=f3e809]: 每局有四分之一到三分之一的令被留在桌上
      - text: 。 不是不想动，是每季提的条数本来就不够填满预算，还要再被重复、超预算、不合法判掉一部分。
    - generic [ref=f3e810]:
      - heading "这一节里哪些是估算" [level=4] [ref=f3e811]
      - paragraph [ref=f3e812]:
        - text: 「令花到哪里」需要知道每条调任收不收令（首次就任免费，调动在任者收 1 令）， 而记录里只有每季的总 spent。做法是取零丢弃的记录， 用残差反推各方的「调任平均收费率」，再乘以采纳条数。 总量校验落在 ±0.6% 内，但
        - strong [ref=f3e813]: 调任那一列是拟合出来的，不构成对成本模型的独立检验
        - text: 。 「探不吃令」则是实测的：在没有任何调任的干净记录里残差恒为 0。

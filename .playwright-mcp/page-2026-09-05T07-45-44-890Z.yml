      - caption [ref=f3e1083]:
        - text: 本报告总榜用的是
        - strong [ref=f3e1084]: 右边那一列
        - text: 。代码两处都已改成汇总口径，机器人重跑逐位一致，分数不受影响。
    - heading "实录里其余三十家从来没动过" [level=3] [ref=f3e1085]
    - paragraph [ref=f3e1086]:
      - text: 生成「详细实录」的那个工具（tools/match-log.mjs） 只把
      - strong [ref=f3e1087]: 被观察席位
      - text: 的命令交给结算，其余三十家从头到尾一动不动。 48 季实测：
      - strong [ref=f3e1088]: 易主 0 郡、下过令的势力 1 家、命令 125 条
      - text: 。 修好之后是易主 45 郡、30 家下令、6539 条命令。 排行榜与混战都是对的，只有实录这一个工具漏了——而它正是用来看「模型到底怎么打」的材料。 现在录完会检查一次，零郡易主就吼一声。
    - heading "其余四处" [level=3] [ref=f3e1089]
    - list [ref=f3e1090]:
      - listitem [ref=f3e1091]:
        - strong [ref=f3e1092]: 套件把 --seasons 吞掉了。
        - text: npm run eval:suite -- --seasons=64 此前会按 16 季跑， 而报告上一个字都看不出来。一次 720 局的长局实验因此只能绕开套件、自己拼汇总。已修。
      - listitem [ref=f3e1093]:
        - strong [ref=f3e1094]: 观测预算闸门被越过一次。
        - text: 闸门要求每席·季 ≤10 000 tok，实跑里 glm 有 1/676 席·季到了 10 139、hy3 有 1/451 到了 10 059。 闸门测的是合成的最坏情形，比真实分布略松。这一轮把内政候选里重复抄的郡情删掉之后峰值降了 168 tok，已覆盖这个余量。
      - listitem [ref=f3e1095]:
        - strong [ref=f3e1096]: 两个模型的局数不是 48。
        - text: glm 43 局、hy3 33 局，都是实扣撞上 $1.50 的预算闸门提前停的。 榜上的配对差只按双方共有的局号相减，所以那一列可比；
        - strong [ref=f3e1097]: 但均分那一列的分母不同，不能直接横比
        - text: 。
      - listitem [ref=f3e1098]:
        - strong [ref=f3e1099]: 结果里同一个字段有两套口径。
        - text: results[].apUse 是局内汇总比， results[].illegalRate 却是局内逐季平均。同一个文件里两种聚合层级并存，后来者极易踩。
  - generic [ref=f3e1100]:
    - generic [ref=f3e1101]: 十一 · 怎么读这份榜
    - heading "方法与可复现" [level=2] [ref=f3e1102]
    - heading "模型看到什么" [level=3] [ref=f3e1103]
    - paragraph [ref=f3e1104]:
      - text: 纯数据，没有截图、没有地图图片。每季给模型一份 JSON：自家逐郡的兵/产/心/防/阵/械/补给/驻将、 在外军团、盟约、上季战报、态势简报（逐州还差几郡即控制）、上季自己写下的方略， 以及
      - strong [ref=f3e1105]: 引擎预先算好的合法候选表
      - text: "。模型只回 {picks, reason, plan}—— 按 key 挑，从不自己填参数。观测里绝不含 seed（拿到 seed 就能反算情报偏差，迷雾作废）。"
    - heading "为什么可比" [level=3] [ref=f3e1106]
    - list [ref=f3e1107]:
      - listitem [ref=f3e1108]: 同一批 48 个 seed，同一批机器人对手，六个席位按局号轮换——每个对局方在每个席位上各打 8 局。
      - listitem [ref=f3e1109]:
        - text: 机器人走与模型
        - strong [ref=f3e1110]: 完全相同
        - text: 的那条路：picks → 准入层 → 命令。否则非法率与令数用率两列对基线是空的。
      - listitem [ref=f3e1111]: 推理档统一钉 low；降级档位（严格 schema / schema-any）并列在榜上，因为受的约束不同。
      - listitem [ref=f3e1112]: 同 seed + 同命令 → 逐位重放。基线在两轮之间逐局分数完全一致，就是靠这条验的。
    - heading "失败要分开记" [level=3] [ref=f3e1113]
    - paragraph [ref=f3e1114]:
      - text: 额度耗尽、鉴权失败、基础设施故障、出参预算被推理吃光、harness 自己的 bug—— 这五类都不算模型的分，单独一栏。这一轮四个模型合计：基础设施 4 席·季（全在 glm）， 模型自身失败 1 席·季（235b 一次解析不出决策），其余为 0。
      - strong [ref=f3e1115]: 这个仓库为「把基础设施的失败算到模型头上」栽过四次
      - text: ：超时、额度耗尽、鉴权， 以及这次的编码损坏。
    - heading "重跑" [level=3] [ref=f3e1116]
    - generic [ref=f3e1117]: npm run eval:suite -- \ --agents=bot:purpose,bot:balanced,model:z-ai/glm-5.3-flash,model:tencent/hy3 \ --games=48 --reasoning=low --budget=6 --jobs=5 --provider=<钉住的提供方>
  - generic [ref=f3e1118]:
    - generic [ref=f3e1119]: 十二 · 结论
    - heading "六条" [level=2] [ref=f3e1120]
    - list [ref=f3e1121]:
      - listitem [ref=f3e1122]:
        - strong [ref=f3e1123]: 模型会用大盘子，机器人会守小摊子。
        - text: 开局十三郡的袁绍席，四个模型全部显著赢过最强机器人（+63 到 +114）； 开局一两郡的曹操、袁术席，机器人赢。总榜上这两头互相抵消，看起来「没差别」。
      - listitem [ref=f3e1124]:
        - strong [ref=f3e1125]: 机器人不是稻草人。
        - text: 改强它的四次尝试全部实测更差（付费调任降权、集结前线优先、州进度阶跃改斜坡各两三档）， 这个贪心评分器在自己这一类里已经到局部最优。要更强得换一类做法——带跨季计划的那种。
      - listitem [ref=f3e1126]:
        - strong [ref=f3e1127]: 路由层比模型差异更大。
        - text: 同一个 model id 在一次评测里出参量差 49 倍、延时差 136 倍； 一整批 50.9% 的「非法率」实际是一家提供方的编码 bug。下一跑必须钉住提供方。
      - listitem [ref=f3e1128]:
        - strong [ref=f3e1129]: 48 局不够。
        - text: 档位是四级台阶，每局的配对差只能取 0 或 ±100，噪声天然很大。 现在能确定的只有「qwen3-30b 显著落后」和「苟活流拿不到分」两件事。
      - listitem [ref=f3e1130]:
        - strong [ref=f3e1131]: 给足时间和一个强开局，模型确实会滚起来。
        - text: 32 季的同场混战里 glm 的袁绍打到 6 州 40 郡、摸到超档—— 而规则机器人 720 局零超档、最高 3 州。这是一局不是名次， 但它把「机器人在长局里不会滚雪球」这条与模型区分开了。
      - listitem [ref=f3e1132]:
        - strong [ref=f3e1133]: 「越到后期越强」这个问题，旧尺子答不了。
        - text: 档位取的是历史最高档的棘轮，把「守不住」从账上抹掉了—— 64 季自对局里 27/48 局终局低于历史最高档、平均掉 69 分。 换成终局分之后，棘轮分不开的两种打法立刻显著分开，而且局越长分得越开。 下一步是把模型放进长局，用这把新尺子量一遍。

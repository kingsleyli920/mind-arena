      - text: 复原生效了，但分掉了 15 分、出局翻了一倍还多。原因不难懂： 一半的令被丢掉时它被迫少做事；令真的执行之后，它的决策把自己打死了。
      - strong [ref=f3e952]: 那个 bug 一直在替它兜底。
      - text: 甲档从 1 涨到 3、丁档从 8 涨到 15——赢得更大也输得更惨，是同一件事的另一面。
    - paragraph [ref=f3e953]:
      - text: 所以修掉一个基础设施缺陷之后分下降，不等于修错了。要分开看两件事：
      - strong [ref=f3e954]: 它的令是不是合法
      - text: （修对了：50.9% → 5.4%），和
      - strong [ref=f3e955]: 它的令好不好
      - text: （本来就不好，只是此前看不到）。

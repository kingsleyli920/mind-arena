  - generic [ref=f3e1046]:
    - generic [ref=f3e1047]: 十 · 这份报告自己查出来的问题
    - heading "闸门本身也会撒谎" [level=2] [ref=f3e1048]
    - paragraph [ref=f3e1049]: 做这份报告时，每份统计都配了一个独立重算的复核。四份复核指向同一处—— 是评测流水线的 bug，不是模型的问题。
    - heading "非法率算的是逐季平均，不是按令数汇总" [level=3] [ref=f3e1050]
    - paragraph [ref=f3e1051]:
      - text: 排行榜上「非法率」与「令数用率」两列一直是
      - strong [ref=f3e1052]: 宏平均
      - text: ：先算每季的率，再取算术平均。 于是一个「提 2 条丢 1 条」的短季，和一个「提 15 条丢 1 条」的满季，被当成一样重。 而短季恰恰是被打残、快出局的那些季——
      - strong [ref=f3e1053]: 越惨的局越把非法率往下拽，正好美化了最该被看见的那些局
      - text: 。
    - table [ref=f3e1055]:
      - rowgroup [ref=f3e1056]:
        - row [ref=f3e1057]:
          - columnheader "模型" [ref=f3e1058]
          - columnheader "旧口径（逐季平均）" [ref=f3e1059]
          - columnheader "正确口径（按令数汇总）" [ref=f3e1060]
          - columnheader "低报" [ref=f3e1061]

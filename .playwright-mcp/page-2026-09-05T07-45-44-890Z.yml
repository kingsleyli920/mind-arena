  - generic [ref=f3e914]:
    - generic [ref=f3e915]: 八 · 一次故障复盘
    - heading "修好编码之后，它的分反而掉了" [level=2] [ref=f3e916]
    - paragraph [ref=f3e918]: 第一份榜上 qwen3-30b 的非法率是 50.9%。查下去，2 806 次 unknown-key 全长这样：
    - generic [ref=f3e919]: "'appoint:æµŽé˜´éƒ¡:caoren' ← 应该是 'appoint:济阴郡:caoren'"
    - paragraph [ref=f3e920]:
      - text: 中文按 UTF-8 编码后又被按 Latin-1 解了一遍。
      - strong [ref=f3e921]: 它每一条其实都选对了。
      - text: 准入层现在会复原（Buffer.from(key,"latin1").toString("utf8")）， 但
      - strong [ref=f3e922]: 只在复原后恰好命中候选时才认
      - text: ——编造的 key 复原之后仍然不在表里，幻觉洗不白。 用旧数据离线验过：2 805 条坏 key 全部复原成合法 UTF-8，其中 86% 直接含剧本里真实存在的郡名， 余下的是 campaign:济阴郡>东郡:allout 这种一段里带两个郡名的，也都是对的。

      - generic [ref=f5e370]:
        - generic [ref=f5e371]: 跨季方略
        - text: 目标：先取山阳郡（州治，乙档），再图兖州过半。本季探明山阳/东郡/梁国守军并调曹仁、夏侯渊驻济阴；下季以探明结果选倾国征伐目标，破城后招降、安抚，逐步向豫州无主地扩张（纪元一末前捡无主地）。
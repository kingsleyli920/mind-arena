      - listitem [ref=f2e993]:
        - strong [ref=f2e994]: 观测预算闸门被越过一次。
        - text: 闸门要求每席·季 ≤10 000 tok，实跑里 glm 有 1/676 席·季到了 10 139、hy3 有 1/451 到了 10 059。 闸门测的是合成的最坏情形，比真实分布略松。这一轮把内政候选里重复抄的郡情删掉之后峰值降了 168 tok，已覆盖这个余量。
      - listitem [ref=f2e995]:
        - strong [ref=f2e996]: 两个模型的局数不是 48。
        - text: glm 43 局、hy3 33 局，都是实扣撞上 $1.50 的预算闸门提前停的。 榜上的配对差只按双方共有的局号相减，所以那一列可比；
        - strong [ref=f2e997]: 但均分那一列的分母不同，不能直接横比
        - text: 。
      - listitem [ref=f2e998]:
        - strong [ref=f2e999]: 结果里同一个字段有两套口径。
        - text: results[].apUse 是局内汇总比， results[].illegalRate 却是局内逐季平均。同一个文件里两种聚合层级并存，后来者极易踩。
  - generic [ref=f2e1000]:
    - generic [ref=f2e1001]: 十 · 怎么读这份榜
    - heading "方法与可复现" [level=2] [ref=f2e1002]
    - heading "模型看到什么" [level=3] [ref=f2e1003]
    - paragraph [ref=f2e1004]:
      - text: 纯数据，没有截图、没有地图图片。每季给模型一份 JSON：自家逐郡的兵/产/心/防/阵/械/补给/驻将、 在外军团、盟约、上季战报、态势简报（逐州还差几郡即控制）、上季自己写下的方略， 以及
      - strong [ref=f2e1005]: 引擎预先算好的合法候选表
      - text: "。模型只回 {picks, reason, plan}—— 按 key 挑，从不自己填参数。观测里绝不含 seed（拿到 seed 就能反算情报偏差，迷雾作废）。"
    - heading "为什么可比" [level=3] [ref=f2e1006]
    - list [ref=f2e1007]:
      - listitem [ref=f2e1008]: 同一批 48 个 seed，同一批机器人对手，六个席位按局号轮换——每个对局方在每个席位上各打 8 局。
      - listitem [ref=f2e1009]:
        - text: 机器人走与模型
        - strong [ref=f2e1010]: 完全相同
        - text: 的那条路：picks → 准入层 → 命令。否则非法率与令数用率两列对基线是空的。
      - listitem [ref=f2e1011]: 推理档统一钉 low；降级档位（严格 schema / schema-any）并列在榜上，因为受的约束不同。
      - listitem [ref=f2e1012]: 同 seed + 同命令 → 逐位重放。基线在两轮之间逐局分数完全一致，就是靠这条验的。
    - heading "失败要分开记" [level=3] [ref=f2e1013]
    - paragraph [ref=f2e1014]:
      - text: 额度耗尽、鉴权失败、基础设施故障、出参预算被推理吃光、harness 自己的 bug—— 这五类都不算模型的分，单独一栏。这一轮四个模型合计：基础设施 4 席·季（全在 glm）， 模型自身失败 1 席·季（235b 一次解析不出决策），其余为 0。
      - strong [ref=f2e1015]: 这个仓库为「把基础设施的失败算到模型头上」栽过四次
      - text: ：超时、额度耗尽、鉴权， 以及这次的编码损坏。
    - heading "重跑" [level=3] [ref=f2e1016]
    - generic [ref=f2e1017]: npm run eval:suite -- \ --agents=bot:purpose,bot:balanced,model:z-ai/glm-5.3-flash,model:tencent/hy3 \ --games=48 --reasoning=low --budget=6 --jobs=5 --provider=<钉住的提供方>
  - generic [ref=f2e1018]:
    - generic [ref=f2e1019]: 十一 · 结论
    - heading "五条" [level=2] [ref=f2e1020]
    - list [ref=f2e1021]:
      - listitem [ref=f2e1022]:
        - strong [ref=f2e1023]: 模型会用大盘子，机器人会守小摊子。
        - text: 开局十三郡的袁绍席，四个模型全部显著赢过最强机器人（+63 到 +114）； 开局一两郡的曹操、袁术席，机器人赢。总榜上这两头互相抵消，看起来「没差别」。
      - listitem [ref=f2e1024]:
        - strong [ref=f2e1025]: 机器人不是稻草人。
        - text: 改强它的四次尝试全部实测更差（付费调任降权、集结前线优先、州进度阶跃改斜坡各两三档）， 这个贪心评分器在自己这一类里已经到局部最优。要更强得换一类做法——带跨季计划的那种。
      - listitem [ref=f2e1026]:
        - strong [ref=f2e1027]: 路由层比模型差异更大。
        - text: 同一个 model id 在一次评测里出参量差 49 倍、延时差 136 倍； 一整批 50.9% 的「非法率」实际是一家提供方的编码 bug。下一跑必须钉住提供方。
      - listitem [ref=f2e1028]:
        - strong [ref=f2e1029]: 48 局不够。
        - text: 档位是四级台阶，每局的配对差只能取 0 或 ±100，噪声天然很大。 现在能确定的只有「qwen3-30b 显著落后」和「苟活流拿不到分」两件事。
      - listitem [ref=f2e1030]:
        - strong [ref=f2e1031]: 「越到后期越强」这个问题，旧尺子答不了。
        - text: 档位取的是历史最高档的棘轮，把「守不住」从账上抹掉了—— 64 季自对局里 27/48 局终局低于历史最高档、平均掉 69 分。 换成终局分之后，棘轮分不开的两种打法立刻显著分开，而且局越长分得越开。 下一步是把模型放进长局，用这把新尺子量一遍。

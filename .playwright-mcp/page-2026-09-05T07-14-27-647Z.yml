    - generic [ref=f2e331]:
      - heading "顺带记一处场景问题" [level=4] [ref=f2e332]
      - paragraph [ref=f2e333]:
        - text: 刘璋那一行三个 ±0 不是巧合：76 局里 56 局（74%）刘璋恰好拿 200 分。 益州开局九郡、四面山险，谁来打都是多据一个州治然后停住。 这个席位对打法几乎不敏感，等于每局白扔六分之一的样本。曹操更极端——
        - strong [ref=f2e334]: 78 局里一次都没控住过任何一个州
        - text: 。
